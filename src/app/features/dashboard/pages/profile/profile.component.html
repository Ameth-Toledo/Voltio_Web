<div class="space-y-6">
  <app-navbar 
    pageTitle="PERFIL" 
    pageSubtitle="Panel de vendedor">
  </app-navbar>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 flex flex-col items-center text-center">
      <div class="relative mb-4">
        <div class="w-24 h-24 rounded-full overflow-hidden ring-4 ring-blue-100">
          <img [src]="profile.image_profile" alt="Perfil" class="w-full h-full object-cover">
        </div>
        <button class="absolute bottom-0 right-0 w-8 h-8 bg-black rounded-full flex items-center justify-center hover:bg-gray-800 transition-colors">
          <lucide-angular [img]="Camera" [size]="14" class="text-white"></lucide-angular>
        </button>
      </div>

      <h2 class="text-lg font-bold text-gray-900">{{ profile.name }} {{ profile.lastname }}</h2>
      <span class="text-sm text-gray-500 mt-0.5">{{ profile.email }}</span>

      <span class="mt-3 px-3 py-1 bg-blue-50 text-blue-700 text-xs font-medium rounded-full">
        {{ profile.role }}
      </span>

      <div class="w-full border-t border-gray-100 mt-5 pt-5 space-y-3">
        <div class="flex items-center gap-3 text-sm text-gray-600">
          <lucide-angular [img]="Phone" [size]="16" class="text-gray-400 shrink-0"></lucide-angular>
          <span>{{ profile.phone }}</span>
        </div>
        <div class="flex items-center gap-3 text-sm text-gray-600">
          <lucide-angular [img]="MapPin" [size]="16" class="text-gray-400 shrink-0"></lucide-angular>
          <span>{{ profile.address }}</span>
        </div>
        <div class="flex items-center gap-3 text-sm text-gray-600">
          <lucide-angular [img]="Store" [size]="16" class="text-gray-400 shrink-0"></lucide-angular>
          <span>Miembro desde {{ profile.memberSince }}</span>
        </div>
      </div>

      <div class="w-full grid grid-cols-3 gap-3 mt-5 border-t border-gray-100 pt-5">
        <div class="flex flex-col items-center">
          <p class="text-xl font-bold text-gray-900">12</p>
          <p class="text-xs text-gray-500 mt-0.5">Productos</p>
        </div>
        <div class="flex flex-col items-center border-x border-gray-100">
          <p class="text-xl font-bold text-gray-900">384</p>
          <p class="text-xs text-gray-500 mt-0.5">Pedidos</p>
        </div>
        <div class="flex flex-col items-center">
          <p class="text-xl font-bold text-gray-900">4.8</p>
          <p class="text-xs text-gray-500 mt-0.5">Calificación</p>
        </div>
      </div>
    </div>

    <div class="lg:col-span-2 bg-white rounded-xl border border-gray-200 shadow-sm p-6">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-base font-semibold text-gray-900">Información personal</h3>
        <div class="flex items-center gap-2">
          <button *ngIf="!isEditing" (click)="startEditing()"
            class="px-4 py-2 bg-black hover:bg-gray-800 text-white rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
            <lucide-angular [img]="User" [size]="16"></lucide-angular>
            Editar perfil
          </button>
          <button *ngIf="isEditing" (click)="cancelEditing()"
            class="px-4 py-2 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 rounded-lg text-sm font-medium transition-colors">
            Cancelar
          </button>
          <button *ngIf="isEditing" (click)="saveProfile()"
            class="px-4 py-2 bg-black hover:bg-gray-800 text-white rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
            <lucide-angular [img]="Save" [size]="16"></lucide-angular>
            Guardar
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Nombre(s)</label>
          <input type="text" [(ngModel)]="editProfile.name" [disabled]="!isEditing"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm outline-none focus:border-gray-400 disabled:bg-gray-50 disabled:text-gray-500 transition-colors">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Segundo nombre</label>
          <input type="text" [(ngModel)]="editProfile.secondname" [disabled]="!isEditing"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm outline-none focus:border-gray-400 disabled:bg-gray-50 disabled:text-gray-500 transition-colors">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Apellido paterno</label>
          <input type="text" [(ngModel)]="editProfile.lastname" [disabled]="!isEditing"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm outline-none focus:border-gray-400 disabled:bg-gray-50 disabled:text-gray-500 transition-colors">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Apellido materno</label>
          <input type="text" [(ngModel)]="editProfile.secondlastname" [disabled]="!isEditing"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm outline-none focus:border-gray-400 disabled:bg-gray-50 disabled:text-gray-500 transition-colors">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Correo electrónico</label>
          <input type="email" [(ngModel)]="editProfile.email" [disabled]="!isEditing"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm outline-none focus:border-gray-400 disabled:bg-gray-50 disabled:text-gray-500 transition-colors">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Teléfono</label>
          <input type="tel" [(ngModel)]="editProfile.phone" [disabled]="!isEditing"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm outline-none focus:border-gray-400 disabled:bg-gray-50 disabled:text-gray-500 transition-colors">
        </div>

        <div class="sm:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Dirección</label>
          <div class="relative">
            <input
              type="text"
              [(ngModel)]="editProfile.address"
              [disabled]="!isEditing"
              (input)="searchAddress(editProfile.address)"
              placeholder="Escribe tu dirección..."
              class="w-full px-4 py-2.5 pr-12 rounded-xl border border-gray-200 text-sm outline-none focus:border-gray-400 disabled:bg-gray-50 disabled:text-gray-500 transition-colors">

            <button *ngIf="isEditing" (click)="detectLocation()" [disabled]="isLocating"
              class="absolute right-3 top-1/2 -translate-y-1/2 p-1 hover:bg-gray-100 rounded-lg transition-colors"
              title="Detectar mi ubicación">
              <lucide-angular [img]="Navigation" [size]="16"
                [class]="isLocating ? 'text-blue-500 animate-pulse' : 'text-gray-500'">
              </lucide-angular>
            </button>

            <div *ngIf="showSuggestions && addressSuggestions.length > 0"
              class="absolute top-full left-0 right-0 bg-white border border-gray-200 rounded-xl shadow-lg mt-1 z-50 overflow-hidden">
              <button *ngFor="let suggestion of addressSuggestions"
                (click)="selectSuggestion(suggestion)"
                class="w-full text-left px-4 py-2.5 hover:bg-gray-50 transition-colors border-b border-gray-100 last:border-0">
                <div class="flex items-start gap-2">
                  <lucide-angular [img]="MapPin" [size]="14" class="text-gray-400 mt-0.5 shrink-0"></lucide-angular>
                  <span class="text-sm text-gray-700 line-clamp-1">{{ suggestion.display_name }}</span>
                </div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mapa iframe -->
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-100 flex items-center gap-2">
      <lucide-angular [img]="MapPin" [size]="18" class="text-gray-500"></lucide-angular>
      <h3 class="text-base font-semibold text-gray-900">Ubicación</h3>
      <span class="text-sm text-gray-500 ml-1">— {{ profile.address }}</span>
    </div>
    <iframe
      [src]="mapUrl | safeUrl"
      width="100%"
      height="400"
      style="border: none; display: block;"
      loading="lazy"
      allowfullscreen>
    </iframe>
  </div>
</div>
