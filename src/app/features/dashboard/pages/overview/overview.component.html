<div class="space-y-6">
  <app-navbar 
    pageTitle="INICIO" 
    pageSubtitle="Panel de vendedor">
  </app-navbar>

  <div class="bg-white rounded-xl p-5 border border-gray-200 shadow-sm">
    <div class="flex items-center justify-between mb-5">
      <div class="flex items-center gap-3">
        <div class="w-14 h-14 rounded-full overflow-hidden ring-2 ring-blue-200">
          <img src="assets/ameth.png" alt="" class="w-full h-full object-cover">
        </div>
        <div>
          <h1 class="text-xl font-bold text-gray-900">Hola de nuevo, {{ userName }}</h1>
          <p class="text-gray-500 text-sm">Bienvenido a tu panel de vendedor</p>
        </div>
      </div>
      <button class="px-5 py-2.5 bg-black hover:bg-gray-800 text-white rounded-lg font-semibold transition-colors flex items-center gap-2">
        <lucide-angular [img]="Plus" [size]="18"></lucide-angular>
        Agregar producto
      </button>
    </div>

    <div class="grid grid-cols-4 gap-3">
      <div class="rounded-xl p-4 border border-blue-100 bg-blue-50">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-blue-100 flex items-center justify-center">
            <lucide-angular [img]="Package" [size]="20" class="text-blue-500"></lucide-angular>
          </div>
          <div>
            <p class="text-gray-500 text-xs">Productos</p>
            <p class="text-2xl font-bold text-gray-900">12</p>
          </div>
        </div>
      </div>

      <div class="rounded-xl p-4 border border-yellow-100 bg-yellow-50">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-yellow-100 flex items-center justify-center">
            <lucide-angular [img]="ShoppingCart" [size]="20" class="text-yellow-500"></lucide-angular>
          </div>
          <div>
            <p class="text-gray-500 text-xs">Pedidos</p>
            <p class="text-2xl font-bold text-gray-900">138</p>
          </div>
        </div>
      </div>

      <div class="rounded-xl p-4 border border-green-100 bg-green-50">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-green-100 flex items-center justify-center">
            <lucide-angular [img]="TrendingUp" [size]="20" class="text-green-500"></lucide-angular>
          </div>
          <div>
            <p class="text-gray-500 text-xs">Ventas</p>
            <p class="text-2xl font-bold text-gray-900">$12.4K</p>
          </div>
        </div>
      </div>

      <div class="rounded-xl p-4 border border-purple-100 bg-purple-50">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-purple-100 flex items-center justify-center">
            <lucide-angular [img]="Star" [size]="20" class="text-purple-500"></lucide-angular>
          </div>
          <div>
            <p class="text-gray-500 text-xs">Calificación</p>
            <p class="text-2xl font-bold text-gray-900">4.8</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div>
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-bold text-gray-900">Productos agregados recientemente</h2>
      <div class="flex items-center gap-2">
        <button class="px-4 py-2 bg-black text-white rounded-lg transition-colors text-sm">
          Todos
        </button>
        <button class="px-4 py-2 bg-white border border-gray-200 hover:bg-gray-50 text-gray-600 rounded-lg transition-colors text-sm">
          Publicados
        </button>
        <button class="px-4 py-2 bg-white border border-gray-200 hover:bg-gray-50 text-gray-600 rounded-lg transition-colors text-sm">
          Borradores
        </button>
      </div>
    </div>

    <div class="flex flex-wrap gap-4">
      <app-product-card
        *ngFor="let product of products"
        [imgSrc]="product.imgSrc"
        [name]="product.name"
        [category]="product.category"
        [rating]="product.rating">
      </app-product-card>
    </div>
  </div>
</div>
