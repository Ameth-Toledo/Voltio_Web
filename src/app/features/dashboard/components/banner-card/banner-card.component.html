<div class="relative w-full rounded-xl overflow-hidden group">
  <div class="relative h-56 md:h-96">
    <img [src]="banner.imagen_url" [alt]="banner.nombre" 
      class="absolute block w-full h-full object-cover">
  </div>

  <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-end gap-2 px-4">
    <span class="text-xs px-2.5 py-1 rounded-full font-medium mr-auto"
      [ngClass]="banner.activo ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'">
      {{ banner.activo ? 'Activo' : 'Inactivo' }}
    </span>
    <button (click)="toggle.emit(banner.id)"
      class="flex items-center gap-1.5 px-3 py-1.5 bg-white rounded-lg text-xs font-medium text-gray-700 hover:bg-gray-100 transition-colors">
      <lucide-angular [img]="banner.activo ? EyeOff : Eye" [size]="13"></lucide-angular>
      {{ banner.activo ? 'Desactivar' : 'Activar' }}
    </button>
    <button (click)="deleteItem.emit(banner.id)"
      class="p-1.5 bg-white hover:bg-red-50 rounded-lg transition-colors">
      <lucide-angular [img]="Trash2" [size]="15" class="text-red-400"></lucide-angular>
    </button>
  </div>
</div>
