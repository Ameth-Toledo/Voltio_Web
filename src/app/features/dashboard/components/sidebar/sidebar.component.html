<div class="h-16 px-4 py-4 flex md:hidden items-center justify-between w-full fixed top-0 left-0 right-0 z-40" style="background-color: #CCDAFF;">
  <a href="/" class="flex items-center space-x-2">
    <img src="assets/voltio.svg" alt="Logo" class="h-8 w-8 shrink-0">
    <span class="font-medium text-gray-900" style="font-family: 'Agdasima', sans-serif;">Voltio</span>
  </a>
  <button (click)="toggleMobileMenu()" class="p-2">
    <svg class="w-6 h-6 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>
</div>

<div 
  *ngIf="isMobileMenuOpen()"
  class="fixed inset-0 bg-black bg-opacity-50 z-40 md:hidden transition-opacity duration-300"
  (click)="closeMobileMenu()">
</div>

<div 
  class="fixed h-full w-full inset-0 p-10 z-50 flex flex-col justify-between md:hidden transition-transform duration-300 ease-in-out"
  style="background-color: #CCDAFF;"
  [ngClass]="{
    '-translate-x-full': !isMobileMenuOpen(),
    'translate-x-0': isMobileMenuOpen()
  }">
  
  <button 
    (click)="closeMobileMenu()"
    class="absolute right-10 top-10 z-50 text-gray-900">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <div class="flex flex-1 flex-col overflow-x-hidden overflow-y-auto">
    <a href="/" class="relative z-20 flex items-center space-x-2 py-1 text-sm font-normal mb-8">
      <img src="assets/voltio.svg" alt="Logo" class="h-8 w-8 shrink-0">
      <span class="font-medium whitespace-pre text-gray-900" style="font-family: 'Agdasima', sans-serif;">Voltio</span>
    </a>

    <nav class="flex flex-col gap-2">
      <a 
        *ngFor="let item of menuItems"
        [routerLink]="item.route"
        (click)="closeMobileMenu()"
        routerLinkActive="bg-white bg-opacity-50"
        class="flex items-center gap-2 group/sidebar py-3 px-2 rounded-lg hover:bg-white hover:bg-opacity-50 transition-colors">
        <svg class="h-5 w-5 shrink-0 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
        </svg>
        <span class="text-gray-900 text-sm">{{ item.label }}</span>
      </a>
    </nav>
  </div>

  <div class="mt-auto space-y-2">
    <a routerLink="/dashboard/profile" (click)="closeMobileMenu()" class="flex items-center gap-2 py-2 px-2 rounded-lg hover:bg-white hover:bg-opacity-50 transition-colors">
      <div class="h-7 w-7 shrink-0 rounded-full overflow-hidden bg-gray-300 flex items-center justify-center">
        <img *ngIf="currentUser?.image_profile" [src]="currentUser!.image_profile!" class="h-full w-full object-cover" alt="Avatar">
        <span *ngIf="!currentUser?.image_profile" class="text-xs font-bold text-gray-600">{{ initials }}</span>
      </div>
      <span class="text-gray-900 text-sm">{{ displayName }}</span>
    </a>
    <button (click)="logout()" class="flex items-center gap-2 py-2 px-2 rounded-lg hover:bg-white hover:bg-opacity-50 transition-colors w-full">
      <svg class="h-5 w-5 shrink-0 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span class="text-gray-900 text-sm">Cerrar Sesión</span>
    </button>
  </div>
</div>

<aside 
  class="hidden md:flex md:flex-col h-screen py-6 fixed left-0 top-0 transition-all duration-300 ease-in-out z-50"
  style="background-color: #CCDAFF;"
  [style.width]="isOpen() ? '280px' : '80px'"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()">
  
  <div class="flex flex-col justify-between h-full">
    <div class="flex flex-1 flex-col overflow-x-hidden overflow-y-auto px-3">
      <a 
        href="/" 
        class="relative z-20 flex items-center py-3 text-sm font-normal mb-6"
        [ngClass]="{
          'justify-center': !isOpen(),
          'justify-start space-x-3 px-3': isOpen()
        }">
        <img src="assets/voltio.svg" alt="Logo" class="h-9 w-9 shrink-0">
        <span 
          class="text-2xl font-bold whitespace-pre text-gray-900 transition-all duration-300 overflow-hidden"
          style="font-family: 'Agdasima', sans-serif;"
          [ngClass]="{
            'opacity-0 w-0': !isOpen(),
            'opacity-100 w-auto': isOpen()
          }">
          Voltio
        </span>
      </a>

      <nav class="flex flex-col gap-1">
        <a 
          *ngFor="let item of menuItems"
          [routerLink]="item.route"
          routerLinkActive="bg-white bg-opacity-50"
          class="flex items-center gap-3 group/sidebar py-3 rounded-xl hover:bg-white hover:bg-opacity-50 transition-all"
          [ngClass]="{
            'justify-center': !isOpen(),
            'justify-start px-4': isOpen()
          }">
          <svg class="h-6 w-6 shrink-0 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
          </svg>
          <span 
            class="text-gray-900 text-sm font-medium group-hover/sidebar:translate-x-1 transition-all duration-150 whitespace-pre overflow-hidden"
            [ngClass]="{
              'opacity-0 w-0': !isOpen(),
              'opacity-100 w-auto': isOpen()
            }">
            {{ item.label }}
          </span>
        </a>
      </nav>
    </div>

    <div class="px-3 space-y-1">
      <button
        (click)="logout()"
        class="flex items-center gap-3 group/sidebar py-3 rounded-xl hover:bg-white hover:bg-opacity-50 transition-all w-full"
        [ngClass]="{
          'justify-center': !isOpen(),
          'justify-start px-4': isOpen()
        }">
        <svg class="h-6 w-6 shrink-0 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span
          class="text-gray-900 text-sm font-medium group-hover/sidebar:translate-x-1 transition-all duration-150 whitespace-pre overflow-hidden"
          [ngClass]="{
            'opacity-0 w-0': !isOpen(),
            'opacity-100 w-auto': isOpen()
          }">
          Cerrar Sesión
        </span>
      </button>
    </div>
  </div>
</aside>
