<div class="min-h-screen bg-[#CFDAFF] flex">
  <div class="w-full min-h-screen flex relative overflow-hidden">

    <!-- Círculo blanco -->
    <div class="absolute left-0 top-0 h-full w-[52%] bg-white rounded-r-full z-10"></div>

    <!-- LEDs -->
    <div class="absolute bottom-0 left-0 z-20">
      <img src="assets/leds 1.png" alt="" class="w-52 object-contain scale-x-[-1]" />
    </div>

    <!-- Panel izquierdo: formulario -->
    <div class="relative z-30 w-1/2 flex items-center justify-center px-10 py-10">
      <div class="w-full max-w-md">

        <!-- Logo a la misma altura que el botón login -->
        <div class="flex items-center justify-between mb-8">
          <div class="flex items-center gap-3">
            <img src="assets/voltio.png" alt="Voltio" class="h-10 w-10 object-contain" />
            <div class="text-xl font-semibold">Voltio</div>
          </div>
          <button
            type="button"
            class="text-sm underline text-gray-700 hover:text-gray-900"
            [routerLink]="'/login'"
          >
            iniciar sesión
          </button>
        </div>

        <h1 class="text-3xl font-semibold mb-6">¡Bienvenido a Voltio!</h1>

        <form [formGroup]="form" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Nombre(s)</label>
            <input
              class="w-full rounded-xl border border-gray-200 px-4 py-3 outline-none focus:border-gray-300"
              type="text"
              formControlName="firstName"
              placeholder="Ameth de Jesus"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Apellido(s)</label>
            <input
              class="w-full rounded-xl border border-gray-200 px-4 py-3 outline-none focus:border-gray-300"
              type="text"
              formControlName="lastName"
              placeholder="Mendez Toledo"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Correo electronico</label>
            <input
              class="w-full rounded-xl border border-gray-200 px-4 py-3 outline-none focus:border-gray-300"
              type="email"
              formControlName="email"
              placeholder="233363@ids.uphiapas.edu.mx"
            />
          </div>

          <div>
            <!-- Label + barra al mismo nivel -->
            <div class="flex items-center justify-between mb-2">
              <label class="text-sm font-medium text-gray-700">Contraseña</label>
              <div class="w-32 h-2 rounded-full bg-gray-200 overflow-hidden flex justify-end">
                <div class="h-2 w-1/3 bg-yellow-400 rounded-full"></div>
              </div>
            </div>
            <div class="relative">
              <input
                class="w-full rounded-xl border border-gray-200 px-4 py-3 pr-12 outline-none focus:border-gray-300"
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                placeholder="••••••••••"
              />
              <button
                type="button"
                (click)="togglePassword()"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700"
              >
                <lucide-icon [img]="showPassword ? EyeOff : Eye" size="18"></lucide-icon>
              </button>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Foto de perfil</label>
            <div class="rounded-xl border-2 border-dashed border-gray-300 bg-gray-50 px-4 py-3">
              <div class="flex items-center gap-3 text-sm text-gray-600">
                <lucide-icon [img]="Upload" size="18" class="opacity-50"></lucide-icon>
                <span>Selecciona o arrastra una imagen</span>
              </div>
            </div>
          </div>

          <div class="pt-2">
            <p class="text-xs text-gray-500 mb-3">o inicia sesión con</p>
            <div class="flex items-center gap-4">
              <button
                type="button"
                class="flex-1 rounded-xl border border-gray-200 px-4 py-3 text-sm font-medium flex items-center justify-center gap-2"
              >
                <img src="assets/google.png" alt="Google" class="h-5 w-5" />
                Google
              </button>
              <button
                type="button"
                class="flex-1 rounded-xl bg-black text-white px-4 py-3 text-sm font-medium flex items-center justify-center gap-2"
              >
                <img src="assets/github.png" alt="GitHub" class="h-5 w-5" />
                GitHub
              </button>
            </div>
          </div>

          <button type="submit" class="w-full rounded-xl bg-black text-white px-4 py-3 font-medium">
            Crear cuenta
          </button>
        </form>
      </div>
    </div>

    <!-- Panel derecho -->
    <div class="relative z-10 flex-1 flex flex-col">

      <!-- Botón iniciar sesión arriba derecha -->
      <div class="flex justify-end p-8">
        <button
          type="button"
          [routerLink]="'/login'"
          class="inline-flex items-center gap-3 rounded-full bg-black text-white px-6 py-3 text-sm font-medium"
        >
          iniciar sesion <span aria-hidden="true">→</span>
        </button>
      </div>

      <!-- Logo, texto e imagen -->
      <div class="flex-1 flex flex-col items-start justify-center px-32 pb-10">
        <div class="flex items-center gap-3 mb-3">
          <img src="assets/voltio.png" alt="Voltio" class="h-16 w-16 object-contain" />
          <div class="text-3xl font-semibold text-gray-900">Voltio</div>
        </div>

        <p class="text-base text-gray-700 mb-8">
          Gracias por confiar en Voltio<br />
          Tu marketplace de electrónica, todo en un solo lugar.
        </p>

        <img
          src="assets/register 1.png"
          alt="Register illustration"
          class="w-full max-w-lg object-contain"
        />
      </div>

    </div>
  </div>
</div>
